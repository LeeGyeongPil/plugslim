# 키·모델 없이 mock 모드로 전체 흐름을 검증한다(Node.js·TypeScript·React).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 — 의존성·런타임이 바뀌어 깨지지 않았는지 정기 확인
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DEMO_MODE: mock
      - run: npm run compile
      # dist/ is committed so `npm install -g github:...` works without TypeScript; it must match src/.
      - name: dist/ is up to date
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)" || { echo "dist/ is out of date: run npm run compile and commit dist/"; exit 1; }
      - name: package-lock.json matches package.json
        run: git diff --exit-code -- package-lock.json
